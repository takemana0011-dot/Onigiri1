const root=document.getElementById('root');
const byDate=ds=>state.entries.filter(e=>e.date===ds).sort((a,b)=>a.t-b.t);
const LAYOUT={1:[[70,15,20]],2:[[56,2,22],[56,42,38]],3:[[48,2,20],[48,50,24],[48,26,48]]};
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const digits=v=>String(v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[^0-9]/g,'').slice(0,6);
const parseD=ds=>{const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d);};
const lastPrice=k=>{const es=state.entries.filter(e=>e.s===k&&e.p).sort((a,b)=>b.t-a.t);return es.length?String(es[0].p):'';};

function stickersFor(es){
  const n=Math.min(es.length,3),L=LAYOUT[n]||[];
  return es.slice(-3).map((e,i)=>{const [w,l,t]=L[i];
    return `<span class="stk${ui.justAdded===e.id?' new':''}" style="width:${w}%;left:${l}%;top:${t}%;--r:${rot(e.id)}deg;z-index:${i+1}">${svg(e.s)}</span>`;}).join('');
}
function period(){
  const a=parseD(ui.anchor);
  if(ui.span==='week'){const s=new Date(a);s.setDate(a.getDate()-a.getDay());const e=new Date(s);e.setDate(s.getDate()+6);
    const lb=(s.getMonth()+1)+'月'+s.getDate()+'日〜'+(e.getMonth()===s.getMonth()?'':(e.getMonth()+1)+'月')+e.getDate()+'日';
    return {s:fmt(s),e:fmt(e),label:lb};}
  const s=new Date(a.getFullYear(),a.getMonth(),1),e=new Date(a.getFullYear(),a.getMonth()+1,0);
  return {s:fmt(s),e:fmt(e),label:a.getFullYear()+'年'+(a.getMonth()+1)+'月'};
}
function statsHTML(){
  const P=period(),es=state.entries.filter(e=>e.date>=P.s&&e.date<=P.e);
  const total=es.reduce((x,e)=>x+(e.p||0),0),unp=es.filter(e=>!e.p).length;
  const g={};es.forEach(e=>{g[e.s]=g[e.s]||{c:0,sum:0};g[e.s].c++;g[e.s].sum+=e.p||0;});
  const ks=Object.keys(g).sort((a,b)=>g[b].sum-g[a].sum||g[b].c-g[a].c);
  const max=Math.max(1,...ks.map(k=>g[k].sum)),maxc=Math.max(1,...ks.map(k=>g[k].c));
  const rows=ks.map(k=>{const w=total?g[k].sum/max*100:g[k].c/maxc*100;
    return `<div class="row"><span class="ri">${svg(k)}</span><div class="rb"><div class="rt"><span>${(STK[k]||{n:k}).n}</span><span class="rv">${g[k].c}回　${yen(g[k].sum)}</span></div><div class="bar"><i style="width:${Math.max(4,w)}%"></i></div></div></div>`;}).join('');
  return `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="集計"><div class="grab"></div><div class="seg"><button data-span="week" aria-pressed="${ui.span==='week'}">週</button><button data-span="month" aria-pressed="${ui.span==='month'}">月</button></div><div class="per"><button data-shift="-1" aria-label="前へ">‹</button><span>${P.label}</span><button data-shift="1" aria-label="次へ">›</button></div><div class="tot"><span class="tot-n">${yen(total)}</span><span class="tot-c">${es.length}回</span></div>${unp?`<p class="hint center">値段なし ${unp}回</p>`:''}${es.length?`<div class="rows">${rows}</div>`:'<p class="empty">この期間のシールはまだありません</p>'}<button class="ghost wide" data-act="close">閉じる</button></div>`;
}

function render(){
  const t=todayStr();
  const first=new Date(vy,vm,1).getDay(),dim=new Date(vy,vm+1,0).getDate();
  let cells='';
  for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    const ds=vy+'-'+pad(vm+1)+'-'+pad(d),es=byDate(ds),fut=ds>t;
    cells+=`<button class="day${ds===t?' today':''}" data-date="${ds}" ${fut?'disabled':''} aria-label="${vm+1}月${d}日${es.length?'、シールあり':''}"><span class="n">${d}</span>${stickersFor(es)}</button>`;
  }
  const last=state.entries.filter(e=>e.mei).sort((a,b)=>a.date===b.date?b.t-a.t:(a.date<b.date?1:-1))[0];
  const recall=last?`この前の一品<b>${esc(last.mei)}</b>`:'食べたら、その日にシールを一枚';
  let ov='';
  if(ui.mode==='add'){
    ov=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="シールを貼る"><div class="grab"></div><div class="sh-date">${label(ui.date)}</div><div class="picks">${ORDER.map(k=>`<button class="pick" data-pick="${k}" aria-pressed="${ui.pick===k}">${svg(k)}<span>${STK[k].n}</span></button>`).join('')}</div><label class="mei-l" for="mei">銘</label><input id="mei" class="mei" maxlength="30" autocomplete="off" placeholder="夕立のあとのプリン" value="${esc(ui.mei)}"><p class="hint">味や、そのときの気分に名前をひとつ</p><label class="mei-l" for="price">値段</label><div class="price-row"><span class="yen">¥</span><input id="price" class="price" inputmode="numeric" autocomplete="off" placeholder="0" value="${esc(ui.price)}"></div><p class="hint">シールを選ぶと、前回の値段が入ります</p><button class="go" data-act="save" ${ui.pick?'':'disabled'}>貼る</button></div>`;
  }else if(ui.mode==='detail'){
    const es=byDate(ui.date),fut=ui.date>t;
    ov=`<div class="scrim" data-act="close"></div><div class="card" role="dialog" aria-modal="true" aria-label="${label(ui.date)}"><div class="sh-date">${label(ui.date)}</div><div class="ents${es.length>1?' multi':''}">${es.map(e=>`<div class="ent"><div class="col"><div class="big" style="--r:${rot(e.id)}deg">${svg(e.s)}</div>${ui.editp===e.id?`<div class="pe"><span class="yen">¥</span><input id="ep" class="price sm" inputmode="numeric" value="${esc(ui.ep)}"><button class="go mini" data-savep="${e.id}">保存</button></div>`:`<button class="pr${e.p?'':' none'}" data-editp="${e.id}">${e.p?yen(e.p):'値段を入れる'}</button>`}</div><div class="v">${e.mei?esc(e.mei):'<span class="nomei">銘なし</span>'}</div><button class="peel${ui.armed===e.id?' armed':''}" data-peel="${e.id}">${ui.armed===e.id?'もう一度押すとはがします':'はがす'}</button></div>`).join('')}</div><div class="card-foot"><button class="ghost" data-act="close">閉じる</button>${fut?'':'<button class="go" data-act="addhere">この日にもう一枚</button>'}</div></div>`;
  }else if(ui.mode==='stats'){ov=statsHTML();}
  else if(ui.mode==='menu'){
    ov=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="バックアップ"><div class="grab"></div><div class="sh-date">バックアップ</div><p class="hint">記録はこの端末のブラウザに保存されています。機種変更やもしもの時のために、ときどきファイルに書き出しておくと安心です。</p><button class="go" data-act="export">バックアップを保存</button><label class="ghost wide filebtn">バックアップを読み込む<input type="file" id="imp" accept="application/json,.json" hidden></label>${ui.msg?`<p class="msg">${esc(ui.msg)}</p>`:''}<button class="ghost wide" data-act="close">閉じる</button></div>`;
  }
  root.innerHTML=`<div class="wrap"><header><div><h1 class="mname">${WA[vm]}</h1><div class="msub">${vy}年${vm+1}月</div></div><div class="nav"><button class="sum" data-act="stats">集計</button><button data-act="menu" aria-label="バックアップ">⋯</button><button data-nav="-1" aria-label="前の月">‹</button><button data-nav="1" aria-label="次の月">›</button></div></header><p class="recall">${recall}</p><div class="cal"><div class="dow">${DOW.map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></div></div>${ui.mode?'':'<button class="fab" data-act="today">今日の一品を貼る</button>'}${ov}`;
  if(ui.justAdded)setTimeout(()=>{ui.justAdded=null;},700);
  if(ui.mode==='detail'&&ui.editp){const i=document.getElementById('ep');if(i){i.focus();}}
}

function openAdd(ds){ui={...ui,mode:'add',date:ds,pick:null,mei:'',price:'',armed:null,editp:null};render();}
root.addEventListener('click',e=>{
  const el=e.target.closest('[data-nav],[data-date],[data-pick],[data-act],[data-peel],[data-span],[data-shift],[data-editp],[data-savep]');
  if(!el)return;
  if(el.dataset.nav){vm+=Number(el.dataset.nav);if(vm<0){vm=11;vy--;}if(vm>11){vm=0;vy++;}render();return;}
  if(el.dataset.date){const ds=el.dataset.date;if(byDate(ds).length){ui={...ui,mode:'detail',date:ds,armed:null,editp:null};render();}else openAdd(ds);return;}
  if(el.dataset.pick){ui.pick=el.dataset.pick;root.querySelectorAll('.pick').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pick===ui.pick));const g=root.querySelector('.go');if(g)g.disabled=false;
    const pi=document.getElementById('price');if(pi&&!pi.value){const lp=lastPrice(ui.pick);if(lp){pi.value=lp;ui.price=lp;}}return;}
  if(el.dataset.span){ui.span=el.dataset.span;render();return;}
  if(el.dataset.shift){const a=parseD(ui.anchor),k=Number(el.dataset.shift);if(ui.span==='week')a.setDate(a.getDate()+7*k);else{a.setDate(1);a.setMonth(a.getMonth()+k);}ui.anchor=fmt(a);render();return;}
  if(el.dataset.editp){const x=state.entries.find(z=>z.id===el.dataset.editp);ui.editp=el.dataset.editp;ui.ep=x&&x.p?String(x.p):'';render();return;}
  if(el.dataset.savep){const x=state.entries.find(z=>z.id===el.dataset.savep);if(x){const v=parseInt(digits(ui.ep),10);x.p=v>0?v:null;state.v++;persist();}ui.editp=null;render();return;}
  if(el.dataset.peel){const id=el.dataset.peel;
    if(ui.armed===id){state.entries=state.entries.filter(x=>x.id!==id);state.v++;ui.armed=null;if(!byDate(ui.date).length)ui.mode=null;render();persist();}
    else{ui.armed=id;render();}return;}
  const a=el.dataset.act;
  if(a==='close'){ui.mode=null;ui.armed=null;ui.editp=null;render();}
  else if(a==='menu'){ui.msg='';ui.mode='menu';render();}
  else if(a==='export'){exportData();}
  else if(a==='stats'){const cur=new Date();ui.anchor=(vy===cur.getFullYear()&&vm===cur.getMonth())?todayStr():fmt(new Date(vy,vm,1));ui.mode='stats';render();}
  else if(a==='today'){const d=new Date();vy=d.getFullYear();vm=d.getMonth();openAdd(todayStr());}
  else if(a==='addhere'){openAdd(ui.date);}
  else if(a==='save'&&ui.pick){
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const pv=parseInt(digits(ui.price),10);
    state.entries.push({id,date:ui.date,s:ui.pick,mei:ui.mei.trim().slice(0,30),p:pv>0?pv:null,t:Date.now()});
    state.v++;const [y,m]=ui.date.split('-').map(Number);vy=y;vm=m-1;
    ui={...ui,mode:null,date:null,pick:null,mei:'',price:'',justAdded:id,armed:null};render();persist();
  }
});
root.addEventListener('input',e=>{
  if(e.target.id==='mei')ui.mei=e.target.value;
  else if(e.target.id==='price'){const v=digits(e.target.value);if(v!==e.target.value)e.target.value=v;ui.price=v;}
  else if(e.target.id==='ep'){const v=digits(e.target.value);if(v!==e.target.value)e.target.value=v;ui.ep=v;}
});
root.addEventListener('change',e=>{if(e.target.id==='imp'&&e.target.files&&e.target.files[0])importData(e.target.files[0]);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.mode){ui.mode=null;ui.editp=null;render();}});
render();
})();
</script></body></html>
